services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: university_qa_backend_prod
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads:rw
      - chroma_data:/app/chroma_data:rw
    env_file:
      - backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    read_only: false  # Set to true if application supports read-only filesystem
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  mongodb:
    image: mongo:6.0
    container_name: university_qa_mongodb_prod
    ports:
      - "27017:27017"
    command: mongod --bind_ip_all --auth
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  chromadb:
    image: chromadb/chroma:latest
    container_name: university_qa_chromadb_prod
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  mongo_data:
  chroma_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16