services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: university_qa_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:cached
      - ./hf_cache:/root/.cache/huggingface:cached
      - ./uploads:/app/uploads:delegated
    env_file:
      - backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - UVICORN_RELOAD_DELAY=0.5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-delay 0.5 --log-level debug --access-log --use-colors
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  mongodb:
    image: mongo:6.0
    container_name: university_qa_mongodb
    ports:
      - "27021:27017"
    command: mongod --bind_ip_all --noauth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: university_qa_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  chroma_data:
  hf_cache:
  frontend_node_modules: